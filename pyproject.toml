[build-system]
requires = ["setuptools>=45", "wheel", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "PyDDStore"
version = "2.1"
description = "Distributed Data Store"
requires-python = ">=3.9"
# numpy, plus mpi4py unless built with DDSTORE_MPI=0 (see setup.py)
dynamic = ["dependencies"]

[project.optional-dependencies]
torch = ["torch"]
